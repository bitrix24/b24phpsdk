name: "OpenSSF Scorecard supply-chain security"
on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"
  push:
  workflow_dispatch: ~

permissions: read-all

jobs:
  analysis:
    name: "Scorecard analysis"
    runs-on: ubuntu-latest
    # Scorecard only supports the repository default branch
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      security-events: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: "Run Scorecard analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Keep results private until the score is good enough for a public badge
          publish_results: false

      - name: "Upload SARIF as artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: "Upload SARIF to code scanning"
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
