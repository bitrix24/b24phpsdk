name: "Rector lint checks"
on:
  push:
  pull_request:

jobs:
  tests:
    name: "Rector lint checks"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Export UID/GID for container user override"
        run: |
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Pull Docker image (build if not yet published)"
        run: docker compose pull || docker compose build

      - name: "Install dependencies"
        run: make composer-install

      - name: "run Rector"
        run: make lint-rector

      - name: "is Rector check succeeded"
        if: ${{ success() }}
        run: |
          echo '✅ Rector check pass, congratulations!'

      - name: "is Rector check failed"
        if: ${{ failure() }}
        run: |
          echo '::error:: ❗️ Rector check failed (╯°益°)╯彡┻━┻'
