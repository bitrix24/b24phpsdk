name: "Deptrac architecture checks"
on:
  push:
  pull_request:

jobs:
  static-analysis:
    name: "Deptrac"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Build Docker image"
        run: docker compose build --build-arg UID=$(id -u) --build-arg GID=$(id -g)

      - name: "Install dependencies"
        run: make composer-install

      - name: "Run Deptrac"
        run: make lint-deptrac

      - name: "is Deptrac check succeeded"
        if: ${{ success() }}
        run: echo '✅ Deptrac check pass, congratulations!'

      - name: "is Deptrac check failed"
        if: ${{ failure() }}
        run: echo '::error:: ❗️ Deptrac check failed (╯°益°)╯彡┻━┻'
