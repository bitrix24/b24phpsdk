name: "Workflow lint (actionlint)"
on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

jobs:
  actionlint:
    name: "actionlint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Run actionlint"
        uses: rhysd/actionlint@v1
        with:
          fail-on-error: true
