name: "Build Docker image"
on:
  push:
    paths:
      - "docker/php-cli/Dockerfile"
  workflow_dispatch: ~

concurrency:
  group: docker-build
  cancel-in-progress: true

jobs:
  build:
    name: "Build & push php-cli"
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: "Get current timestamp"
        id: timestamp
        run: echo "rfc3339=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Docker QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build & push image"
        uses: docker/build-push-action@v6
        with:
          context: ./docker/php-cli
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/bitrix24/b24phpsdk:php-cli
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.rfc3339 }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
