name: "PHPUnit tests"
on:
  push:
  pull_request:

env:
  COMPOSER_FLAGS: "--ansi --no-interaction --no-progress --prefer-dist"

jobs:
  tests:
    name: "PHPUnit tests"

    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.3"
          - "8.4"
        dependencies: [ highest ]
        operating-system: [ ubuntu-latest, windows-2022]

    steps:
      - name: "Set git config for NTFS (Windows only)"
        if: runner.os == 'Windows'
        run: git config --global core.protectNTFS false

      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: json, bcmath, curl, intl, mbstring

      - name: "Install dependencies"
        run: |
          composer update ${{ env.COMPOSER_FLAGS }}

      - name: "run unit tests"
        run: "composer phpunit-run-unit-tests"

      - name: "is unit tests tests succeeded"
        if: ${{ success() }}
        run: |
          echo '✅ unit tests pass, congratulations!'

      - name: "is unit tests tests failed"
        if: ${{ failure() }}
        run: |
          echo '::error:: ❗️ unit tests tests failed (╯°益°)╯彡┻━┻'

  coverage:
    name: "Code coverage"

    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "pcov"
          php-version: "8.4"
          extensions: json, bcmath, curl, intl, mbstring

      - name: "Install dependencies"
        run: |
          composer update ${{ env.COMPOSER_FLAGS }}

      - name: "run unit tests with code coverage"
        run: "composer phpunit-run-unit-tests-coverage"

      - name: "publish code coverage summary"
        if: ${{ always() }}
        run: |
          {
            echo '### Code coverage (unit tests)'
            echo '```'
            cat var/coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "upload code coverage report"
        if: ${{ always() }}
        uses: "actions/upload-artifact@v4"
        with:
          name: "code-coverage-report"
          path: var/coverage/
          retention-days: 14
