name: "PHPUnit tests"
on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  tests:
    name: "PHPUnit tests"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Export UID/GID for container user override"
        run: |
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build current PHP runtime"
        run: docker compose build --pull

      - name: "Install dependencies"
        run: make composer-install

      - name: "run unit tests"
        run: make test-unit

      - name: "is unit tests tests succeeded"
        if: ${{ success() }}
        run: |
          echo '✅ unit tests pass, congratulations!'

      - name: "is unit tests tests failed"
        if: ${{ failure() }}
        run: |
          echo '::error:: ❗️ unit tests tests failed (╯°益°)╯彡┻━┻'

  coverage:
    name: "Code coverage"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Export UID/GID for container user override"
        run: |
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build current PHP runtime"
        run: docker compose build --pull

      - name: "Install dependencies"
        run: make composer-install

      - name: "run unit tests with code coverage"
        run: make test-unit-coverage

      - name: "publish code coverage summary"
        if: ${{ always() }}
        run: |
          {
            echo '### Code coverage (unit tests)'
            echo '```'
            cat var/coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "upload code coverage report"
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "code-coverage-report"
          path: var/coverage/
          retention-days: 14
