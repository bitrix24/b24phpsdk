name: "Leaked secrets checks"
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: "gitleaks"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: "Install gitleaks"
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sed "s/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz/gitleaks.tar.gz/" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}" gitleaks
          rm gitleaks.tar.gz checksums.txt

      - name: "gitleaks"
        run: "${RUNNER_TEMP}/gitleaks git --no-banner --redact --verbose --config .gitleaks.toml ."

      - name: "is gitleaks check succeeded"
        if: ${{ success() }}
        run: |
          echo '✅ gitleaks check pass, congratulations!'

      - name: "is gitleaks check failed"
        if: ${{ failure() }}
        run: |
          echo '::error:: ❗️ gitleaks found leaked secrets, revoke them and clean up the history (╯°益°)╯彡┻━┻'
