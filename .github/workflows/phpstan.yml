name: "PHPStan lint checks"
on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  static-analysis:
    name: "PHPStan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Export UID/GID for container user override"
        run: |
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build current PHP runtime"
        run: docker compose build --pull

      - name: "Install dependencies"
        run: make composer-install

      - name: "PHPStan"
        run: make lint-phpstan

      - name: "is PHPStan check succeeded"
        if: ${{ success() }}
        run: |
          echo '✅ PHPStan check pass, congratulations!'

      - name: "is PHPStan check failed"
        if: ${{ failure() }}
        run: |
          echo '::error:: ❗️ PHPStan check failed (╯°益°)╯彡┻━┻'
